name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # every Monday, to test the newest Raspberry Pi kernel
  workflow_dispatch:

jobs:
  device-tree:
    name: Device tree overlays and binding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler
          pip install dtschema yamllint
      - name: Build overlays
        run: make dtbo
      - name: Get Raspberry Pi kernel source
        # The default branch is the kernel that Raspberry Pi OS currently ships.
        run: git clone --depth 1 https://github.com/raspberrypi/linux.git ../linux
      - name: Check binding with dt_binding_check
        run: |
          cp "ams,mira220.yaml" ../linux/Documentation/devicetree/bindings/media/i2c/
          make -s -C ../linux dt_binding_check DT_SCHEMA_FILES="ams,mira220.yaml" 2>&1 | tee binding.log
          # Other bindings in the tree may warn; fail only on our own.
          ! grep "ams,mira220" binding.log

  rpi-kernel:
    name: Build for Raspberry Pi kernel (${{ matrix.board }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: Pi 3, Pi 4, Zero 2 W
            defconfig: bcm2711_defconfig
          - board: Pi 5
            defconfig: bcm2712_defconfig
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev
      - name: Get Raspberry Pi kernel source
        # The default branch is the kernel that Raspberry Pi OS currently ships.
        run: git clone --depth 1 https://github.com/raspberrypi/linux.git ../linux
      - name: Prepare kernel
        run: |
          make -C ../linux ${{ matrix.defconfig }}
          make -C ../linux -j"$(nproc)" modules_prepare
      - name: Build module
        # modules_prepare does not create Module.symvers, so kernel symbols
        # cannot be resolved here: report them as warnings. All code is still compiled.
        run: make KDIR="$(realpath ../linux)" KBUILD_MODPOST_WARN=1
      - name: Report tested kernel
        run: |
          echo "### Built for ${{ matrix.board }}" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kernel | Branch | Defconfig |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| $(make -s -C ../linux kernelversion) | $(git -C ../linux branch --show-current) | ${{ matrix.defconfig }} |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: mira220-${{ matrix.defconfig }}
          path: mira220.ko

  dkms:
    name: DKMS install and uninstall
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install DKMS and kernel headers
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y dkms linux-headers-generic
      - name: Install with DKMS
        run: |
          KERNELVER=$(ls /lib/modules | head -n 1)
          echo "Building for $KERNELVER"
          echo "### DKMS tested on Ubuntu 26.04, kernel $KERNELVER" >> "$GITHUB_STEP_SUMMARY"
          KERNELVER=$KERNELVER ./dkms-install.sh
          dkms status | grep "mira220/.*: installed"
      - name: Uninstall
        run: |
          ./dkms-uninstall.sh
          test -z "$(dkms status)"
