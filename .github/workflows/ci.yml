name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  device-tree:
    name: Device tree overlays and binding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler
          pip install dtschema yamllint
      - name: Build overlays
        run: make dtbo
      - name: Get Raspberry Pi kernel source
        run: git clone --depth 1 --branch rpi-6.18.y https://github.com/raspberrypi/linux.git ../linux
      - name: Check binding with dt_binding_check
        run: |
          cp "ams,mira220.yaml" ../linux/Documentation/devicetree/bindings/media/i2c/
          make -s -C ../linux dt_binding_check DT_SCHEMA_FILES="ams,mira220.yaml" 2>&1 | tee binding.log
          # Other bindings in the tree may warn; fail only on our own.
          ! grep "ams,mira220" binding.log

  rpi-kernel:
    name: Build for Raspberry Pi kernel ${{ matrix.branch }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        branch: [rpi-6.12.y, rpi-6.18.y]
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev
      - name: Get Raspberry Pi kernel source
        run: git clone --depth 1 --branch ${{ matrix.branch }} https://github.com/raspberrypi/linux.git ../linux
      - name: Prepare kernel
        run: |
          make -C ../linux bcm2711_defconfig
          make -C ../linux -j"$(nproc)" modules_prepare
      - name: Build module
        # modules_prepare does not create Module.symvers, so kernel symbols
        # cannot be resolved here: report them as warnings. All code is still compiled.
        run: make KDIR="$(realpath ../linux)" KBUILD_MODPOST_WARN=1
      - uses: actions/upload-artifact@v5
        with:
          name: mira220-${{ matrix.branch }}
          path: mira220.ko

  dkms:
    name: DKMS install and uninstall
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install DKMS and kernel headers
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y dkms linux-headers-generic
      - name: Install with DKMS
        run: |
          KERNELVER=$(ls /lib/modules | head -n 1)
          echo "Building for $KERNELVER"
          KERNELVER=$KERNELVER ./dkms-install.sh
          dkms status | grep "mira220/.*: installed"
      - name: Uninstall
        run: |
          ./dkms-uninstall.sh
          test -z "$(dkms status)"
